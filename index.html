<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        main {
            width: 100%;
            max-width: 960px;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }
        a.card {
            display: block;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        a.card:hover {
            transform: translateY(-2px);
            border-color: #fbbf24;
        }
        .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .desc {
            font-size: 0.9rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <main>
        <h1>My Browser Games</h1>
        <div class="grid">
            <a class="card" href="chillspot.html">
                <div class="icon">🏡</div>
                <div class="title">ChillSpot</div>
                <div class="desc">Cozy multiplayer slime courtyard hangout.</div>
            </a>
            <a class="card" href="linguarush.html">
                <div class="icon">⚡</div>
                <div class="title">LinguaRush</div>
                <div class="desc">Fast-paced language-learning arcade microgames.</div>
            </a>
            <a class="card" href="kotodama-dungeon.html">
                <div class="icon">🗡️</div>
                <div class="title">Kotodama Dungeon</div>
                <div class="desc">Turn-based tactical roguelike deckbuilder.</div>
            </a>
            <a class="card" href="komorebi/index.html">
                <div class="icon">⛩️</div>
                <div class="title">Komorebi</div>
                <div class="desc">Cozy Japanese-themed multiplayer hangout.</div>
            </a>
        </div>
    </main>
</body>
</html>
