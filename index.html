            stones.forEach((s) => {
                ctx.fillStyle = 'rgba(214, 211, 209, 0.25)';
                ctx.beginPath();
                ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            // Center Woven Picnic Rug & Floor Cushions
            const rugX = WORLD_W / 2;
            const rugY = WORLD_H / 2 + 15;
            ctx.fillStyle = 'rgba(24, 16, 20, 0.25)';
            ctx.beginPath();
            ctx.roundRect(rugX - 118, rugY - 76, 236, 156, 24);
            ctx.fill();

            ctx.fillStyle = '#e7cbb3';
            ctx.beginPath();
            ctx.roundRect(rugX - 115, rugY - 80, 230, 152, 22);
            ctx.fill();

            // Woven Terracotta & Sage Stripes
            ctx.fillStyle = '#d97757';
            ctx.fillRect(rugX - 102, rugY - 62, 204, 14);
            ctx.fillRect(rugX - 102, rugY + 42, 204, 14);
            ctx.fillStyle = '#6b9080';
            ctx.fillRect(rugX - 102, rugY - 40, 204, 8);
            ctx.fillRect(rugX - 102, rugY + 26, 204, 8);

            // Plush Corner Cushions on Rug
            const cushions = [
                { x: rugX - 75, y: rugY - 22, c: '#fda4af' },
                { x: rugX + 75, y: rugY - 22, c: '#93c5fd' },
                { x: rugX - 75, y: rugY + 28, c: '#fcd34d' },
                { x: rugX + 75, y: rugY + 28, c: '#d8b4fe' }
            ];
            cushions.forEach((cu) => {
                ctx.fillStyle = cu.c;
                ctx.beginPath();
                ctx.roundRect(cu.x - 16, cu.y - 12, 32, 24, 9);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Berry Bushes in Courtyard Corners
            const bushes = [
                { x: 95, y: 95 },
                { x: WORLD_W - 95, y: 95 },
                { x: 95, y: WORLD_H - 95 },
                { x: WORLD_W - 95, y: WORLD_H - 95 }
            ];
            bushes.forEach((b) => {
                ctx.fillStyle = '#1b4332';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 34, 0, Math.PI * 2);
                ctx.arc(b.x + 24, b.y + 8, 26, 0, Math.PI * 2);
                ctx.arc(b.x - 22, b.y + 10, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.arc(b.x - 6, b.y - 8, 3.2, 0, Math.PI * 2);
                ctx.arc(b.x + 14, b.y + 4, 3.2, 0, Math.PI * 2);
                ctx.arc(b.x - 15, b.y + 12, 3.2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Click-to-walk target ring
            if (clickTarget) {
                const pulse = 8 + Math.sin(now * 0.01) * 3;
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.75)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.ellipse(clickTarget.x, clickTarget.y, pulse * 1.4, pulse * 0.85, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Interactive Props
            drawCourtyardProps(now);

            // Depth-sort & Draw All Avatars
            const allEntities = [
                localPlayer,
                ...Array.from(remotePlayers.values()),
                ...botCompanions
            ].sort((a, b) => a.y - b.y);

            allEntities.forEach((entity) => {
                drawAvatarGraphic(
                    ctx,
                    entity.x,
                    entity.y,
                    entity.colorIdx,
                    entity.accessoryIdx,
                    entity.faceIdx || 0,
                    entity.facing || 'down',
                    entity.walkCycle || 0,
                    entity.isMoving || false,
                    entity.name,

            // Draw Nameplates & Speech Bubbles on top
            allEntities.forEach((entity) => {
                drawNameTagAndBubble(ctx, entity);

            // Overhead Hanging String Fairy Lights
            drawStringFairyLights(now);

            // Drifting Golden Fireflies
            fireflies.forEach((f) => {
                const glow = 0.35 + Math.sin(now * 0.004 + f.phase) * 0.35;
                ctx.fillStyle = `rgba(254, 240, 138, ${Math.max(0.05, glow)})`;

                ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);

            ctx.restore();

            // Warm Twilight Vignette
            const vig = ctx.createRadialGradient(

        function drawCourtyardProps(now) {
            // 1. Cozy Stone Firepit
            const fire = PROPS[0];
            ctx.save();
            ctx.translate(fire.x, fire.y);

            if (propStates.campfireLit) {
                const glowR = 95 + Math.sin(now * 0.008) * 10;
                const fGrad = ctx.createRadialGradient(0, 0, 8, 0, 0, glowR);
                fGrad.addColorStop(0, 'rgba(251, 146, 60, 0.42)');
                fGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
                ctx.fillStyle = fGrad;
                ctx.beginPath();
                ctx.arc(0, 0, glowR, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ring of Stones
            for (let i = 0; i < 10; i++) {
                const ang = (i / 10) * Math.PI * 2;
                ctx.fillStyle = i % 2 === 0 ? '#78716c' : '#57534e';
                ctx.beginPath();
                ctx.ellipse(Math.cos(ang) * 28, Math.sin(ang) * 20, 8, 6, ang, 0, Math.PI * 2);
                ctx.fill();
            }

            // Crossed Logs
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-14, -6); ctx.lineTo(14, 8);
            ctx.moveTo(14, -6); ctx.lineTo(-14, 8);
            ctx.stroke();

            // Flickering Flame

                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-13, 4);
                ctx.quadraticCurveTo(-15, -18, flicker, -26);
                ctx.quadraticCurveTo(15, -18, 13, 4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.moveTo(-7, 4);
                ctx.quadraticCurveTo(-8, -10, -flicker * 0.5, -16);
                ctx.quadraticCurveTo(8, -10, 7, 4);
                ctx.closePath();
                ctx.fill();

            ctx.restore();

            ctx.roundRect(-56, -28, 112, 28, 14);

            // Cushions

            ctx.beginPath();
            ctx.roundRect(-52, -10, 104, 30, 12);

            ctx.beginPath();
            ctx.roundRect(-62, -16, 16, 36, 8);

            ctx.roundRect(-42, -16, 18, 16, 6);

            ctx.fillStyle = '#bae6fd';

            ctx.arc(20, -11, 3.8, 0, Math.PI * 2);
            ctx.fill();

            // Active Pebble Ripples
            pondRipples.forEach((rip) => {
                ctx.strokeStyle = `rgba(224, 242, 254, ${rip.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, rip.r * 1.4, rip.r * 0.9, 0, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();

            // 6. Retro Bean Arcade Cabinet
            const arcade = PROPS[5];
            ctx.save();
            ctx.translate(arcade.x, arcade.y);

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 24, 26, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabinet Body
            ctx.fillStyle = '#7c3aed';
            ctx.beginPath();
            ctx.roundRect(-20, -32, 40, 54, [10, 10, 4, 4]);
            ctx.fill();

            // Glowing Arcade Screen
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(-14, -24, 28, 22, 4);
            ctx.fill();

            const starY = -14 + Math.sin(now * 0.006) * 4;
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, starY, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Joystick & Colorful Buttons
            ctx.fillStyle = '#4c1d95';
            ctx.fillRect(-16, 2, 32, 8);
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.arc(-7, 5, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.arc(5, 5, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(11, 5, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 7. Bouncy Shroom Trampoline
            const shroom = PROPS[6];
            ctx.save();
            ctx.translate(shroom.x, shroom.y);
            const shroomBounce = 1 + Math.sin(now * 0.005) * 0.03;
            ctx.scale(shroomBounce, 2 - shroomBounce);

            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            ctx.beginPath();
            ctx.ellipse(0, 18, 28, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Stalk
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.roundRect(-11, -2, 22, 20, 6);
            ctx.fill();

            // Polka-Dot Cap
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.ellipse(0, -4, 28, 15, 0, Math.PI, Math.PI * 2);
            ctx.ellipse(0, -4, 28, 6, 0, 0, Math.PI);
            ctx.fill();

            // Cream Spots
            ctx.fillStyle = '#fffbeb';
            ctx.beginPath();
            ctx.arc(-11, -9, 4.2, 0, Math.PI * 2);
            ctx.arc(10, -8, 4.5, 0, Math.PI * 2);
            ctx.arc(0, -13, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Highlight ring around nearby interactable prop (shows cooldown progress if cooling down)
            if (nearbyProp) {
                const cdElapsed = Date.now() - lastPropUseTime;
                const isCoolingDown = cdElapsed < PROP_COOLDOWN_MS;
                ctx.save();
                ctx.strokeStyle = isCoolingDown ? 'rgba(251, 113, 133, 0.7)' : 'rgba(253, 224, 71, 0.65)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash(isCoolingDown ? [] : [6, 6]);
                ctx.beginPath();
                if (isCoolingDown) {
                    const pct = Math.min(1, cdElapsed / PROP_COOLDOWN_MS);
                    ctx.arc(nearbyProp.x, nearbyProp.y, nearbyProp.radius * 0.72, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
                } else {
                    ctx.arc(nearbyProp.x, nearbyProp.y, nearbyProp.radius * 0.72, 0, Math.PI * 2);
                }
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawStringFairyLights(now) {
            const strands = [
                { x1: 60, y1: 60, x2: WORLD_W - 60, y2: 60, sag: 34 },
                { x1: 60, y1: 60, x2: 60, y2: WORLD_H - 60, sag: 28 },
                { x1: WORLD_W - 60, y1: 60, x2: WORLD_W - 60, y2: WORLD_H - 60, sag: 28 }
            ];

            strands.forEach((s, sIdx) => {
                ctx.strokeStyle = 'rgba(41, 37, 36, 0.75)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(s.x1, s.y1);
                const midX = (s.x1 + s.x2) / 2;
                const midY = (s.y1 + s.y2) / 2 + s.sag;
                ctx.quadraticCurveTo(midX, midY, s.x2, s.y2);
                ctx.stroke();

                const bulbs = 14;
                for (let i = 1; i < bulbs; i++) {
                    const t = i / bulbs;
                    const bx = (1 - t) * (1 - t) * s.x1 + 2 * (1 - t) * t * midX + t * t * s.x2;
                    const by = (1 - t) * (1 - t) * s.y1 + 2 * (1 - t) * t * midY + t * t * s.y2;

                    if (propStates.fairyLightsOn) {
                        const twinkle = 0.7 + Math.sin(now * 0.005 + i + sIdx) * 0.3;
                        const bulbColors = ['#fde047', '#fda4af', '#fed7aa', '#bae6fd'];
                        const bCol = bulbColors[(i + sIdx) % bulbColors.length];

                        ctx.fillStyle = `rgba(254, 240, 138, ${0.22 * twinkle})`;
                        ctx.beginPath();
                        ctx.arc(bx, by + 4, 13, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = bCol;
                        ctx.beginPath();
                        ctx.arc(bx, by + 4, 3.8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#57534e';
                        ctx.beginPath();
                        ctx.arc(bx, by + 4, 3.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        }

        // ==========================================
        // 7. SIMULATION & MAIN ANIMATION LOOP
        // ==========================================
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function screenToWorld(clientX, clientY) {
            return {
                x: clientX - canvas.width / 2 + camera.x,
                y: clientY - canvas.height / 2 + camera.y
            };
        }

        function updateSimulation(dt) {
            // Update ambient fireflies
            fireflies.forEach((f) => {
                f.x += f.vx * dt;
                f.y += f.vy * dt;
                if (f.x < 40) f.x = WORLD_W - 40;
                if (f.x > WORLD_W - 40) f.x = 40;
                if (f.y < 40) f.y = WORLD_H - 40;
                if (f.y > WORLD_H - 40) f.y = 40;
            });

            // Update pond ripples
            for (let i = pondRipples.length - 1; i >= 0; i--) {
                pondRipples[i].r += 24 * dt;
                pondRipples[i].alpha -= 0.55 * dt;
                if (pondRipples[i].alpha <= 0) pondRipples.splice(i, 1);
            }

            // Spawn & animate peaceful shooting stars in the night sky
            if (!shootingStar && Math.random() < 0.004) {
                shootingStar = {
                    x: Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                    y: Math.random() * canvas.height * 0.35,
                    vx: 420 + Math.random() * 180,
                    vy: 190 + Math.random() * 90,
                    alpha: 1
                };
            }
            if (shootingStar) {
                shootingStar.x += shootingStar.vx * dt;
                shootingStar.y += shootingStar.vy * dt;
                shootingStar.alpha -= 0.85 * dt;
                if (shootingStar.alpha <= 0) shootingStar = null;
            }

            if (!inGame) return;

            // Bouncy mushroom jump gravity physics
            if (localPlayer.jumpHeight > 0 || localPlayer.jumpVel > 0) {
                localPlayer.jumpHeight += localPlayer.jumpVel * dt;
                localPlayer.jumpVel -= 920 * dt;
                if (localPlayer.jumpHeight <= 0) {
                    localPlayer.jumpHeight = 0;
                    localPlayer.jumpVel = 0;
                }
            }

            // Keyboard movement vector
            let vx = 0;
            let vy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) vy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) vx += 1;

            if (vx !== 0 || vy !== 0) {
                clickTarget = null;
                const len = Math.hypot(vx, vy);
                vx /= len;
                vy /= len;
                localPlayer.x += vx * PLAYER_SPEED * dt;
                localPlayer.y += vy * PLAYER_SPEED * dt;
                localPlayer.isMoving = true;
                localPlayer.walkCycle += dt * 4.5;

                if (Math.abs(vx) > Math.abs(vy)) {
                    localPlayer.facing = vx > 0 ? 'right' : 'left';
                } else {
                    localPlayer.facing = vy > 0 ? 'down' : 'up';
                }
            } else if (clickTarget) {
                const dx = clickTarget.x - localPlayer.x;
                const dy = clickTarget.y - localPlayer.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 6) {
                    localPlayer.x += (dx / dist) * PLAYER_SPEED * dt;
                    localPlayer.y += (dy / dist) * PLAYER_SPEED * dt;
                    localPlayer.isMoving = true;
                    localPlayer.walkCycle += dt * 4.5;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        localPlayer.facing = dx > 0 ? 'right' : 'left';
                    } else {
                        localPlayer.facing = dy > 0 ? 'down' : 'up';
                    }
                } else {
                    clickTarget = null;
                    localPlayer.isMoving = false;
                }
            } else {
                if (localPlayer.isMoving) {
                    localPlayer.isMoving = false;
                    broadcastImmediateState();
                }
            }

            // Keep local player inside courtyard fence
            localPlayer.x = Math.max(55, Math.min(WORLD_W - 55, localPlayer.x));
            localPlayer.y = Math.max(55, Math.min(WORLD_H - 55, localPlayer.y));

            // Smoothly interpolate remote players
            remotePlayers.forEach((rp) => {
                const dx = (rp.targetX ?? rp.x) - rp.x;
                const dy = (rp.targetY ?? rp.y) - rp.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    rp.x += dx * Math.min(1, dt * 12);
                    rp.y += dy * Math.min(1, dt * 12);
                    rp.isMoving = true;
                    rp.walkCycle = (rp.walkCycle || 0) + dt * 4.5;
                } else {
                    rp.isMoving = false;
                }
            });

            // Update solo bots if in solo mode
            updateSoloBots(dt);

            // Smooth camera follow
            camera.x += (localPlayer.x - camera.x) * Math.min(1, dt * 8);
            camera.y += (localPlayer.y - camera.y) * Math.min(1, dt * 8);

            // Check proximity to interactive props
            let closest = null;
            let closestDist = Infinity;
            PROPS.forEach((prop) => {
                const d = Math.hypot(localPlayer.x - prop.x, localPlayer.y - prop.y);
                if (d <= prop.radius && d < closestDist) {
                    closest = prop;
                    closestDist = d;
                }
            });

            nearbyProp = closest;
            const promptBanner = document.getElementById('propPromptBanner');
            const interactBtn = document.getElementById('propInteractBtn');
            if (nearbyProp) {
                const remaining = PROP_COOLDOWN_MS - (Date.now() - lastPropUseTime);
                document.getElementById('propPromptIcon').textContent = nearbyProp.icon;
                document.getElementById('propPromptText').textContent = `${nearbyProp.name}: ${nearbyProp.getPrompt()}`;
                if (interactBtn) {
                    if (remaining > 0) {
                        interactBtn.textContent = `${(remaining / 1000).toFixed(1)}s`;
                        interactBtn.classList.add('opacity-60');
                    } else {
                        interactBtn.textContent = 'Use';
                        interactBtn.classList.remove('opacity-60');
                    }
                }
                promptBanner.classList.remove('hidden');
            } else {
                promptBanner.classList.add('hidden');
            }

            // Throttled position sync while moving
            const now = performance.now();
            if (localPlayer.isMoving && now - lastSyncTime > 90) {
                lastSyncTime = now;
                broadcastImmediateState();
            }
        }

        let lastFrameTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
            lastFrameTime = now;

            updateSimulation(dt);
            drawCourtyardWorld(now);

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 8. UI & INPUT EVENT BINDINGS
        // ==========================================
        function buildColorSwatches() {
            const container = document.getElementById('colorSwatches');
            if (!container) return;
            container.innerHTML = '';
            AVATAR_COLORS.forEach((col, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.title = col.name;
                btn.style.backgroundColor = col.swatch;
                btn.className = `w-6 h-6 rounded-full border-2 transition transform active:scale-90 ${
                    localPlayer.colorIdx === idx ? 'border-stone-800 scale-110 shadow' : 'border-white'
                }`;
                btn.addEventListener('click', () => {
                    localPlayer.colorIdx = idx;
                    buildColorSwatches();
                    drawAvatarPreview();
                    playPopSound(520 + idx * 30);
                });
                container.appendChild(btn);
            });
        }

        function bindUIEvents() {
            // Nickname input
            const nameInput = document.getElementById('playerNameInput');
            nameInput?.addEventListener('input', (e) => {
                localPlayer.name = e.target.value.trim() || 'Mochi';
                drawAvatarPreview();
            });

            // Cycle Accessory & Silly Face
            document.getElementById('cycleAccessoryBtn')?.addEventListener('click', () => {
                localPlayer.accessoryIdx = (localPlayer.accessoryIdx + 1) % ACCESSORIES.length;
                drawAvatarPreview();
                playPopSound(600);
            });

            document.getElementById('cycleFaceBtn')?.addEventListener('click', () => {
                localPlayer.faceIdx = ((localPlayer.faceIdx || 0) + 1) % FACES.length;
                drawAvatarPreview();
                playPopSound(720);
            });

            // Host / Join / Solo Buttons
            document.getElementById('hostRoomBtn')?.addEventListener('click', () => {
                localPlayer.name = (nameInput?.value.trim() || 'Mochi').slice(0, 16);
                startHostingRoom();
            });

            document.getElementById('joinRoomBtn')?.addEventListener('click', () => {
                localPlayer.name = (nameInput?.value.trim() || 'Mochi').slice(0, 16);
                const code = document.getElementById('joinCodeInput')?.value || '';
                joinExistingRoom(code);
            });

            document.getElementById('joinCodeInput')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('joinRoomBtn')?.click();
                }
            });

            document.getElementById('soloPlayBtn')?.addEventListener('click', () => {
                localPlayer.name = (nameInput?.value.trim() || 'Mochi').slice(0, 16);
                startSoloMode();
            });

            // HUD Buttons
            document.getElementById('copyCodeBtn')?.addEventListener('click', () => {
                if (!currentRoomCode) return;
                fallbackCopyCode(currentRoomCode);
            });

            document.getElementById('playersToggleBtn')?.addEventListener('click', () => {
                document.getElementById('playersDropdown')?.classList.toggle('hidden');
            });

            document.getElementById('hudLofiBtn')?.addEventListener('click', () => {
                toggleLofiAudio();
            });

            document.getElementById('leaveRoomBtn')?.addEventListener('click', () => {
                leaveRoom();
            });

            document.getElementById('propInteractBtn')?.addEventListener('click', () => {
                if (nearbyProp) interactWithProp(nearbyProp);
            });

            // Toggle Chat Log Collapse
            document.getElementById('toggleChatLogBtn')?.addEventListener('click', () => {
                chatLogCollapsed = !chatLogCollapsed;
                const panel = document.getElementById('chatLogPanel');
                if (chatLogCollapsed) {
                    panel?.classList.add('hidden');
                } else {
                    panel?.classList.remove('hidden');
                    unreadChatCount = 0;
                    updateUnreadBadge();
                }
            });

            // Chat Form & Quick Emotes
            document.getElementById('chatForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('chatInput');
                if (!input) return;
                if (input.value.trim()) {
                    triggerSpeechBubble(input.value);
                    input.value = '';
                }
                input.blur();
            });

            document.querySelectorAll('.emote-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const emote = btn.getAttribute('data-emote');
                    if (emote) triggerSpeechBubble(emote);
                });
            });

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                    return;
                }
                keys[e.code] = true;

                if (e.code === 'KeyE' && inGame && nearbyProp) {
                    interactWithProp(nearbyProp);
                } else if (e.code === 'Enter' && inGame) {
                    e.preventDefault();
                    document.getElementById('chatInput')?.focus();
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            // Canvas Click / Tap to Move or Interact with Prop
            canvas.addEventListener('pointerdown', (e) => {
                if (!inGame) return;
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    document.activeElement.blur();
                }

                const worldPt = screenToWorld(e.clientX, e.clientY);

                // Check if user tapped directly on a prop they're already standing near
                for (const prop of PROPS) {
                    const clickDist = Math.hypot(worldPt.x - prop.x, worldPt.y - prop.y);
                    const playerDist = Math.hypot(localPlayer.x - prop.x, localPlayer.y - prop.y);
                    if (clickDist <= 46 && playerDist <= prop.radius + 15) {
                        interactWithProp(prop);
                        return;
                    }
                }

                clickTarget = {
                    x: Math.max(55, Math.min(WORLD_W - 55, worldPt.x)),
                    y: Math.max(55, Math.min(WORLD_H - 55, worldPt.y))
                };
            });

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('beforeunload', () => {
                if (inGame) leaveRoom();
            });
        }

        // ==========================================
        // 9. BOOTSTRAP APPLICATION
        // ==========================================
        window.onload = async function () {
            resizeCanvas();
            buildColorSwatches();
            drawAvatarPreview();
            bindUIEvents();
            await initFirebaseIfAvailable();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
